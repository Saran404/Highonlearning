<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0a2e5c" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#061c38" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>HighonLearning LMS - Learn • Practice • Achieve</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Serif:wght@400;600&family=Noto+Serif+Tamil:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <!-- Hide Netlify Badge and Netlify Drawer completely -->
    <style>
      #nl-badge,
      .nl-badge,
      [id*="nl-badge"],
      [class*="nl-badge"],
      netlify-drawer,
      [data-netlify-drawer],
      div[class*="netlify"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        position: absolute !important;
        top: -9999px !important;
        left: -9999px !important;
        clip: rect(0, 0, 0, 0) !important;
        clip-path: inset(50%) !important;
        z-index: -9999 !important;
      }
    </style>
    <script>
      (function() {
        function removeNetlifyBadge() {
          var els = document.querySelectorAll('#nl-badge, .nl-badge, [id*="nl-badge"], [class*="nl-badge"], netlify-drawer, [data-netlify-drawer]');
          for (var i = 0; i < els.length; i++) {
            els[i].remove();
          }
        }
        removeNetlifyBadge();
        if (typeof window !== 'undefined') {
          window.addEventListener('DOMContentLoaded', removeNetlifyBadge);
          window.addEventListener('load', removeNetlifyBadge);
          try {
            new MutationObserver(removeNetlifyBadge).observe(document.documentElement, { childList: true, subtree: true });
          } catch (e) {}
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
